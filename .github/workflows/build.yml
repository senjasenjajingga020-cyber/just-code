name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile
        run: gcc main.c -o chatbot -Wall -Wextra -Werror

      - name: Smoke test
        run: printf 'hello\nbye\n' | ./chatbot
